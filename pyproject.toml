[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naji"
version = "1.0.0"
description = "Tray-first voice assistant for Windows and Linux"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "PySide6>=6.7,<7.0",
    "qasync>=0.24,<1.0",
    "sounddevice>=0.5,<1.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    "httpx>=0.28,<1.0",
    "websockets>=15,<18",
    "ddgs>=9.0,<10.0",
]

[project.optional-dependencies]
linux = [
    "dbus-next>=0.2,<1.0",
    "keyboard>=0.13,<1.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "pyinstaller>=6.8,<7.0",
]

[project.scripts]
naji = "naji.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["naji*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PIE"]
ignore = [
    "E501",
    "TRY003",
    "N802",  # Qt event overrides
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

